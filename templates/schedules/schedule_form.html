{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}📅 {{ title }}{% endblock %}
{% block content %}
<div class="card form-card">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="form-group"><label>Plant Plot *</label>{{ form.plot }}</div>
      <div class="form-group"><label>Care Type *</label>{{ form.care_type }}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div class="form-group"><label>Repeat Every (days)</label>{{ form.frequency_days }}</div>
        <div class="form-group"><label>Next Due Date *</label>{{ form.next_due_date }}</div>
      </div>
      <div class="form-group"><label>Notes</label>{{ form.notes }}</div>
      <div class="flex gap-2 mt-3">
        <button type="submit" class="btn btn-primary">💾 Save Schedule</button>
        <a href="{% url 'schedule_list' %}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
