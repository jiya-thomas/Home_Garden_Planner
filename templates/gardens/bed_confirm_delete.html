{% extends 'base.html' %}
{% block title %}Delete Bed{% endblock %}
{% block page_title %}🗑️ Delete Garden Bed{% endblock %}
{% block content %}
<div class="card form-card">
  <div class="card-body" style="text-align:center;padding:40px">
    <div style="font-size:3rem;margin-bottom:12px">⚠️</div>
    <h3 style="font-family:'Nunito',sans-serif;font-size:1.2rem;margin-bottom:8px">Delete "{{ bed.name }}"?</h3>
    <p class="text-muted mb-3">This will remove the bed and ALL plants and schedules in it.</p>
    <form method="post">
      {% csrf_token %}
      <div class="flex gap-2" style="justify-content:center">
        <button type="submit" class="btn btn-danger">🗑️ Yes, Delete</button>
        <a href="{% url 'bed_detail' bed.pk %}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
