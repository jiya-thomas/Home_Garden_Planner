{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}🪴 {{ title }}{% endblock %}
{% block content %}
<div class="card form-card">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div class="form-group" style="grid-column:1/-1"><label>Bed Name *</label>{{ form.name }}</div>
        <div class="form-group"><label>Width (ft)</label>{{ form.width_ft }}</div>
        <div class="form-group"><label>Length (ft)</label>{{ form.length_ft }}</div>
        <div class="form-group"><label>Soil Type</label>{{ form.soil_type }}</div>
        <div class="form-group"><label>Light Condition</label>{{ form.light_condition }}</div>
        <div class="form-group" style="grid-column:1/-1"><label>Notes</label>{{ form.notes }}</div>
      </div>
      <div class="flex gap-2 mt-3">
        <button type="submit" class="btn btn-primary">💾 Save</button>
        <a href="{% url 'bed_list' %}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
