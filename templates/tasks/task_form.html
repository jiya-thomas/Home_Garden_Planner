{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}✅ {{ title }}{% endblock %}
{% block content %}
<div class="card form-card">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="form-group"><label>Task Title *</label>{{ form.title }}</div>
      <div class="form-group"><label>Description</label>{{ form.description }}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div class="form-group"><label>Due Date</label>{{ form.due_date }}</div>
        <div class="form-group"><label>Priority</label>{{ form.priority }}</div>
      </div>
      <div class="form-group"><label>Related Garden Bed</label>{{ form.related_garden_bed }}</div>
      <div class="flex gap-2 mt-3">
        <button type="submit" class="btn btn-primary">💾 Save Task</button>
        <a href="{% url 'task_list' %}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
