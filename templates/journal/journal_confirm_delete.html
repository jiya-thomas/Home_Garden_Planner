{% extends 'base.html' %}
{% block title %}Delete Entry{% endblock %}
{% block page_title %}🗑️ Delete Journal Entry{% endblock %}
{% block content %}
<div class="card form-card">
  <div class="card-body" style="text-align:center;padding:40px">
    <div style="font-size:3rem;margin-bottom:12px">⚠️</div>
    <h3 style="font-family:'Nunito',sans-serif;font-size:1.2rem;margin-bottom:8px">Delete this journal entry?</h3>
    <p class="text-muted mb-3">{{ entry.plot.plant.name }} — {{ entry.date }}</p>
    <form method="post">
      {% csrf_token %}
      <div class="flex gap-2" style="justify-content:center">
        <button type="submit" class="btn btn-danger">🗑️ Delete</button>
        <a href="{% url 'journal_detail' entry.pk %}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
